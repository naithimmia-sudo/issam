<style>
:root{--brown:#5b2e26;--brown2:#7a4235;--gold:#d6ad63;--cream:#faf7f2;--ink:#2e211e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#fff 0,#f3eee8 48%,#e7ddd4 100%);display:flex;align-items:center;justify-content:center;padding:22px 14px}
.card{width:min(100%,430px);position:relative;overflow:hidden;border:1px solid rgba(214,173,99,.6);border-radius:30px;padding:28px 22px 24px;background:linear-gradient(145deg,#fff 0%,#f8f2eb 52%,#eee2d8 100%);box-shadow:0 22px 45px #4c2b242e, inset 0 1px 0 #fff}
.card:before{content:"";position:absolute;inset:9px;border:1px solid #d6ad6370;border-radius:23px;pointer-events:none}
.brand{position:relative;text-align:center}.logo{width:154px;height:154px;border-radius:50%;object-fit:cover;border:4px solid #d7b16b;box-shadow:0 9px 20px #48251f30}

.tag{display:inline-block;background:linear-gradient(135deg,#6b382d,#43231f);color:#fff8ed;padding:10px 17px;border-radius:14px;font-size:14px;letter-spacing:.25px;box-shadow:0 5px 0 #321b17,0 9px 15px #48251f2b;margin-bottom:21px;border:1px solid #cda45c}
.actions{display:grid;gap:13px;position:relative}.btn{display:flex;align-items:center;gap:13px;text-decoration:none;color:#fffaf2;padding:14px 16px;border-radius:17px;background:linear-gradient(145deg,#7a493c,#4a2721);border:1px solid #d4b06c;box-shadow:0 6px 0 #321b17,0 10px 15px #48251f24,inset 0 1px 1px #ffffff30;transition:transform .15s,box-shadow .15s}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #321b17,0 4px 8px #48251f24}.ico{width:43px;height:43px;flex:0 0 43px;border-radius:13px;background:linear-gradient(145deg,#fff7e8,#e8d1a3);display:grid;place-items:center;color:#5b2e26;box-shadow:inset 0 2px 3px #fff,0 3px 7px #26110f45}.ico svg{width:25px;height:25px;fill:currentColor}.label{display:block;font-weight:700;font-size:15px}.small{display:block;font-size:12px;opacity:.78;margin-top:4px;overflow-wrap:anywhere}.arrow{margin-left:auto;font-size:23px;color:#e7c783}.footer{text-align:center;font-size:11px;color:#8a7065;margin-top:23px;letter-spacing:1.2px}.footer span{color:#a67a3c}
@media(max-width:360px){.card{padding:24px 17px}.logo{width:135px;height:135px}h1{font-size:25px}.btn{padding:12px}}
